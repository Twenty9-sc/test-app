select,button{width:100%;padding:12px;border-radius:10px;border:1px solid #334155;background:#1E293B;color:white;font-weight:700}
button{margin-top:8px}

.section{display:none}.section.active{display:block}
pre{background:#0F172A;border:1px solid #334155;border-radius:10px;padding:10px;font-size:10px;overflow:auto;max-height:300px}

</div>

<div class="tabs">
${["Aéro","Trans","Géo","Susp","Freins","Pneus","Tous","Résumé"].map(t=>`<div class="tab ${t===currentTab?"active":""}" onclick="setTab('${t}')">${t}</div>`).join("")}
</div>

<div id="paramsArea"></div>

<div class="card card-${color}">
<h4 style="margin:0 0 6px">📋 Résumé ${currentYear} ${y.icon}</h4>
<pre id="resume"></pre>
<button class="btn-${color}" onclick="downloadJSON()">💾 Télécharger JSON ${currentYear}</button>
<button style="background:#1E293B" onclick="copyResume()">📋 Copier</button>
</div>
`;
div.innerHTML=html;
renderParams();
updateResume();
}

function setTab(t){currentTab=t;render();}

function renderParams(){
const y=DATA[currentYear];
const setup=setups[currentYear];
const area=document.getElementById("paramsArea");
if(!area)return;
if(currentTab==="Résumé"){area.innerHTML="";return;}
let toShow=currentTab==="Tous"?PARAMS:PARAMS.filter(p=>p.tab===currentTab|| (currentTab==="Aéro"&&p.tab==="Aéro")|| (currentTab==="Trans"&&p.tab==="Trans")|| (currentTab==="Géo"&&p.tab==="Géo")|| (currentTab==="Susp"&&p.tab==="Susp")|| (currentTab==="Freins"&&p.tab==="Freins")|| (currentTab==="Pneus"&&p.tab==="Pneus"));
let html=`<div class="grid2">`;
toShow.forEach(p=>{
html+=`<div class="card card-${y.color}"><label>${p.label}</label><div style="display:flex;gap:8px;align-items:center"><input type="range" id="${p.id}" min="${p.min}" max="${p.max}" step="${p.step}" value="${setup[p.id]}" oninput="updateParam('${p.id}',this.value)"><span class="value" id="val-${p.id}">${setup[p.id]}</span></div></div>`;
});
html+=`</div>`;
area.innerHTML=html;
}

function updateParam(id,val){
setups[currentYear][id]=parseFloat(val);
document.getElementById("val-"+id).textContent=val;
updateResume();
}

function changeTrack(v){tracks[currentYear]=v;render();}

function applyPreset(){
const y=DATA[currentYear];
const sel=document.getElementById("presetSel").value;
setups[currentYear]={...y.presets[sel]};
render();
}

function updateResume(){
const y=DATA[currentYear];
const setup=setups[currentYear];
const track=tracks[currentYear];
const tinfo=y.circuits[track];
const vmax=340-(setup.aero_av+setup.aero_ar)*4;
const bal=setup.aero_av-setup.aero_ar;
const balText=bal<-2?"Sur-vireur":bal>2?"Sous-vireur":"Neutre";
const el=document.getElementById("resume");
if(!el)return;
el.textContent=`F1 ${currentYear} ${y.icon} SETUP - ${track} [${tinfo.code}]
${y.title} - ${y.color.toUpperCase()}

AERO AV:${setup.aero_av} AR:${setup.aero_ar} BAL:${bal>0?"+":""}${bal} (${balText})
DIFF ON:${setup.diff_on}% OFF:${setup.diff_off}%
CAMBER AV:${setup.camber_av} AR:${setup.camber_ar} TOE AV:${setup.toe_av} AR:${setup.toe_ar}
SUSP AV:${setup.susp_av} AR:${setup.susp_ar} ARB AV:${setup.arb_av} AR:${setup.arb_ar} H AV:${setup.height_av} AR:${setup.height_ar}
BRAKE ${setup.brake_press}% BIAS ${setup.brake_bias}%
TYRE AV:${setup.tyre_av} AR:${setup.tyre_ar} BALLAST:${setup.ballast}
VMAX EST: ${vmax} km/h
CIRCUIT TYPE: ${tinfo.type}
STRATEGIE: ${tinfo.strat}

STRATEGIES ${currentYear}:
${y.strategies.join("\n")}
`;
}

function downloadJSON(){
const y=DATA[currentYear];
const data={jeu:`F1 ${currentYear}`,edition:y.color,circuit:tracks[currentYear],code:y.circuits[tracks[currentYear]].code,setup:setups[currentYear],strategie:y.circuits[tracks[currentYear]].strat,date:new Date().toISOString()};
const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
const url=URL.createObjectURL(blob);
const a=document.createElement("a");a.href=url;a.download=`F1_${currentYear}_${data.code}_${y.color}.json`;a.click();
URL.revokeObjectURL(url);
}

function copyResume(){
navigator.clipboard.writeText(document.getElementById("resume").textContent).then(()=>alert("💜 Setup copié "+currentYear));
}

render();
</script>
</body>
</html>
